name: test

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rsp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rsp-server/go.mod
          cache-dependency-path: rsp-server/go.sum
      - run: make test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rsp-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rsp-client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
