services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rsp
      POSTGRES_PASSWORD: rsp
      POSTGRES_DB: rsp
    ports:
      # Host 5433 so a native Postgres on 5432 can coexist. Inside Compose this is still 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsp -d rsp"]
      interval: 2s
      timeout: 5s
      retries: 15

  # golang-migrate one-shot on the Compose network. Talks to db:5432 (container port),
  # not the published host port. Exit 0 = schema current.
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      [
        "-verbose",
        "-path=/migrations",
        "-database=postgres://rsp:rsp@db:5432/rsp?sslmode=disable",
        "up",
      ]
    restart: on-failure

volumes:
  pgdata:
